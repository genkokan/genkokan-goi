<title>現古館 語彙ドリル</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#F7F4EC;
    --paper-raised:#FFFDF7;
    --ink:#22201C;
    --ink-soft:#6E665A;
    --ink-faint:#A69C8C;
    --rule:#DED6C6;
    --shu:#B34026;
    --shu-soft:#F0E0D8;
    --ai:#2E4A57;
    --ai-soft:#DFE8EA;
    --shadow:0 1px 0 rgba(34,32,28,.04), 0 6px 18px -12px rgba(34,32,28,.35);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#16161A; --paper-raised:#1E1E23; --ink:#EBE5DA; --ink-soft:#A49C90;
      --ink-faint:#6C6559; --rule:#33323A; --shu:#E27B5E; --shu-soft:#3A2622;
      --ai:#8FB6C4; --ai-soft:#22323A;
      --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -14px rgba(0,0,0,.8);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#16161A; --paper-raised:#1E1E23; --ink:#EBE5DA; --ink-soft:#A49C90;
    --ink-faint:#6C6559; --rule:#33323A; --shu:#E27B5E; --shu-soft:#3A2622;
    --ai:#8FB6C4; --ai-soft:#22323A;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -14px rgba(0,0,0,.8);
    color-scheme:dark;
  }

  body{
    background:var(--paper); color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:560px; margin:0 auto;
    padding-inline:18px; padding-block:26px 48px;
    display:flex; flex-direction:column; gap:20px;
  }
  .mincho{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;}

  .masthead{border-bottom:1px solid var(--rule);padding-bottom:12px;}
  .masthead h1{font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;font-weight:700;
    font-size:22px;margin:0;letter-spacing:.06em;}

  /* ---- mode toggle ---- */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--rule);border-radius:2px;overflow:hidden;}
  .modes button{
    appearance:none;font:inherit;cursor:pointer;background:var(--paper-raised);color:var(--ink-soft);
    border:0;padding:11px 8px;font-size:13.5px;letter-spacing:.04em;
    transition:background .12s ease,color .12s ease;
  }
  .modes button + button{border-left:1px solid var(--rule);}
  .modes button[aria-selected="true"]{background:var(--shu);color:#FFF8F4;font-weight:700;}
  :root[data-theme="dark"] .modes button[aria-selected="true"]{color:#1A100D;}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .modes button[aria-selected="true"]{color:#1A100D;}
  }

  /* ---- home ---- */
  .setgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  @media (max-width:400px){.setgrid{grid-template-columns:1fr;}}
  .setcard{
    appearance:none;text-align:left;cursor:pointer;
    background:var(--paper-raised);color:inherit;
    border:1px solid var(--rule);border-radius:3px;
    padding:12px 14px;display:flex;flex-direction:column;gap:2px;
    font:inherit;box-shadow:var(--shadow);
    transition:border-color .15s ease, transform .15s ease;
  }
  .setcard:hover{border-color:var(--shu);transform:translateY(-1px);}
  .setcard .no{font-family:"Shippori Mincho",serif;font-size:17px;font-weight:700;letter-spacing:.04em;}
  .setcard .range{font-size:11.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums;letter-spacing:.06em;}
  .setcard .best{font-size:11.5px;color:var(--shu);letter-spacing:.04em;min-height:1.4em;}

  .examcard{
    appearance:none;text-align:left;cursor:pointer;font:inherit;width:100%;
    background:var(--paper-raised);color:inherit;
    border:1px solid var(--rule);border-left:3px solid var(--shu);border-radius:2px;
    padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:14px;
    box-shadow:var(--shadow);transition:border-color .15s ease;
  }
  .examcard:hover{border-color:var(--shu);}
  .examcard .t{font-family:"Shippori Mincho",serif;font-size:18px;font-weight:700;letter-spacing:.08em;}
  .examcard .d{font-size:11.5px;color:var(--ink-faint);letter-spacing:.04em;}
  .examcard .r{font-size:12px;color:var(--shu);text-align:right;flex:0 0 auto;}

  /* ---- quiz ---- */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--ink-soft);}
  .bar .count{font-variant-numeric:tabular-nums;letter-spacing:.08em;}
  .track{height:2px;background:var(--rule);border-radius:2px;overflow:hidden;}
  .track > i{display:block;height:100%;background:var(--shu);width:0;transition:width .25s ease;}

  .prompt{
    background:var(--paper-raised);border:1px solid var(--rule);border-left:3px solid var(--shu);
    border-radius:2px;padding:20px;box-shadow:var(--shadow);
  }
  .prompt .label{font-size:11px;letter-spacing:.2em;color:var(--ink-faint);margin-bottom:10px;}
  .prompt .meaning{
    font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;
    font-size:19px;line-height:1.95;font-weight:500;text-wrap:balance;margin:0;
  }
  .prompt .meaning .blank{color:var(--shu);font-weight:700;letter-spacing:.1em;}
  @media (max-width:400px){.prompt .meaning{font-size:17.5px;}}

  .choices{display:flex;flex-direction:column;gap:8px;}
  .choice{
    appearance:none;font:inherit;cursor:pointer;text-align:left;
    background:var(--paper-raised);color:inherit;
    border:1px solid var(--rule);border-radius:2px;
    padding:12px 14px;display:flex;align-items:center;gap:12px;
    transition:border-color .12s ease,background .12s ease;
  }
  .choice:hover:not(:disabled){border-color:var(--ai);}
  .choice:disabled{cursor:default;}
  .choice .mark{
    flex:0 0 auto;width:22px;height:22px;border-radius:50%;
    border:1px solid var(--rule);display:grid;place-items:center;
    font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums;
  }
  .choice .word{font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;font-size:19px;font-weight:500;letter-spacing:.02em;}
  .choice.is-right{border-color:var(--shu);background:var(--shu-soft);}
  .choice.is-right .mark{border-color:var(--shu);color:var(--shu);}
  .choice.is-wrong{border-color:var(--ai);background:var(--ai-soft);opacity:.85;}
  .choice.is-dim{opacity:.45;}

  .verdict{border-top:1px solid var(--rule);padding-top:14px;display:flex;flex-direction:column;gap:6px;}
  .verdict .head{font-family:"Shippori Mincho",serif;font-size:17px;font-weight:700;letter-spacing:.1em;}
  .verdict.ok .head{color:var(--shu);}
  .verdict.ng .head{color:var(--ai);}
  .verdict .head .tap{font-family:"Zen Kaku Gothic New",sans-serif;font-size:11px;font-weight:400;
    letter-spacing:.08em;color:var(--ink-faint);margin-left:10px;}
  .verdict .gloss{font-size:13.5px;color:var(--ink-soft);}
  .verdict .gloss b{font-family:"Shippori Mincho",serif;font-weight:700;color:var(--ink);font-size:15px;}
  .verdict .filled{font-family:"Shippori Mincho",serif;font-size:14.5px;color:var(--ink);line-height:1.85;}
  .verdict .filled em{font-style:normal;font-weight:700;color:var(--shu);}
  .countdown{height:2px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:4px;}
  .countdown > i{display:block;height:100%;width:100%;background:var(--shu);transform-origin:left center;}
  .verdict.ng .countdown > i{background:var(--ai);}
  .countdown.run > i{animation:drain linear forwards;animation-duration:var(--dur,1s);}
  @keyframes drain{from{transform:scaleX(1);}to{transform:scaleX(0);}}

  /* ---- result ---- */
  .score{
    background:var(--paper-raised);border:1px solid var(--rule);border-radius:2px;
    padding:20px;text-align:center;box-shadow:var(--shadow);
  }
  .score.pass{border-color:var(--shu);border-width:2px;}
  .score .n{font-family:"Shippori Mincho",serif;font-size:40px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;}
  .score .n small{font-size:18px;color:var(--ink-faint);font-weight:500;}
  .score .caption{font-size:12.5px;color:var(--ink-soft);letter-spacing:.06em;}
  .score .stamp{font-family:"Shippori Mincho",serif;font-size:21px;font-weight:700;letter-spacing:.3em;
    margin-bottom:4px;}
  .score .stamp.y{color:var(--shu);}
  .score .stamp.n{color:var(--ai);}
  .misslist{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--rule);}
  .missrow{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:11px 2px;border-bottom:1px solid var(--rule);align-items:baseline;}
  .missrow .w{font-family:"Shippori Mincho",serif;font-size:17px;font-weight:700;}
  .missrow .y{font-size:11px;color:var(--ink-faint);grid-column:1;}
  .missrow .m{font-size:13px;color:var(--ink-soft);grid-column:2;grid-row:1 / span 2;}
  .sectitle{font-size:11px;letter-spacing:.2em;color:var(--ink-faint);}

  .actions{display:flex;flex-wrap:wrap;gap:8px;}
  .btn{
    appearance:none;font:inherit;cursor:pointer;
    border:1px solid var(--rule);background:var(--paper-raised);color:inherit;
    border-radius:2px;padding:9px 16px;font-size:13.5px;letter-spacing:.04em;
    transition:border-color .12s ease,color .12s ease;
  }
  .btn:hover{border-color:var(--shu);color:var(--shu);}
  .btn.primary{background:var(--shu);border-color:var(--shu);color:#FFF8F4;}
  :root[data-theme="dark"] .btn.primary{color:#1A100D;}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#1A100D;}}
  .btn.primary:hover{filter:brightness(1.06);}

  :focus-visible{outline:2px solid var(--ai);outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
  .fade{animation:fade .22s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}
</style>

<div class="wrap">
  <header class="masthead">
    <h1 class="mincho">現古館 語彙ドリル</h1>
  </header>

 {n:215,w:"葛藤",y:"かっとう",m:"争い、もめごと。相反する要求に挟まれた心理状態",s:"進学か就職かで、彼は長いあいだ［　］を抱えていた。"},
 {n:216,w:"典型的",y:"てんけいてき",m:"同類の中で最もその特徴を表しているさま",s:"朝食を抜き夜更かしを続けるのは、［　］な生活の乱れである。"}

const SETS = [];
for (let i = 0; i < WORDS.length; i += 10) SETS.push(WORDS.slice(i, i + 10));

const KANSUJI = ["一","二","三","四","五","六","七","八"];
const STORE_KEY = "genkokan-goi-best-v2";
const EXAM_N = 20;
const EXAM_PASS = 18;

const MODES = {
  meaning: { label:"意味から選ぶ", prompt:"つぎの意味にあたる語は", field:"m" },
  cloze:   { label:"例文の空所",   prompt:"空所に入る語は",       field:"s" }
};
let mode = "meaning";

function loadBest(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); }
  catch(e){ return {}; }
}
function saveBest(obj){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(obj)); } catch(e){}
}
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function setOfWord(word){
  return SETS[Math.floor((word.n - WORDS[0].n) / 10)];
}
function esc(t){ return t.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function markBlank(sentence){
  return esc(sentence).replace("［　］", '<span class="blank">［　　］</span>');
}
function fillBlank(sentence, word){
  return esc(sentence).replace("［　］", "<em>" + esc(word) + "</em>");
}

const stage = document.getElementById("stage");
let state = null;

/* ---------------- home ---------------- */
function renderHome(){
  clearTimer();
  state = null;
  const best = loadBest();
  const cards = SETS.map((set, i) => {
    const b = best[mode + "-" + i];
    return `<button class="setcard" data-set="${i}">
      <span class="no mincho">第${KANSUJI[i]}集</span>
      <span class="range">${set[0].n}–${set[set.length-1].n}　全${set.length}問</span>
      <span class="best">${b === undefined ? "" : `最高 ${b} / ${set.length}`}</span>
    </button>`;
  }).join("");
  const eb = best[mode + "-exam"];

  stage.innerHTML = `
    <div class="fade" style="display:flex;flex-direction:column;gap:18px;">
      <div class="modes" role="tablist">
        <button role="tab" data-mode="meaning" aria-selected="${mode === "meaning"}">${MODES.meaning.label}</button>
        <button role="tab" data-mode="cloze" aria-selected="${mode === "cloze"}">${MODES.cloze.label}</button>
      </div>
      <div class="setgrid">${cards}</div>
      <button class="examcard" id="exam">
        <span style="display:flex;flex-direction:column;gap:1px;">
          <span class="t mincho">通しテスト</span>
          <span class="d">全${WORDS.length}語から${EXAM_N}問を無作為抽出　${EXAM_PASS}問以上で合格</span>
        </span>
        <span class="r">${eb === undefined ? "挑戦" : `最高 ${eb} / ${EXAM_N}`}</span>
      </button>
    </div>`;

  stage.querySelectorAll("[data-mode]").forEach(btn => {
    btn.addEventListener("click", () => { mode = btn.dataset.mode; renderHome(); });
  });
  stage.querySelectorAll(".setcard").forEach(btn => {
    btn.addEventListener("click", () => startSet(Number(btn.dataset.set)));
  });
  document.getElementById("exam").addEventListener("click", startExam);
}

/* ---------------- start ---------------- */
function newState(extra){
  clearTimer();
  return Object.assign({
    i:0, correct:0, missed:[], answered:false, timer:null, canSkipAt:0
  }, extra);
}
function startSet(setIndex){
  state = newState({ kind:"set", setIndex, queue: shuffle(SETS[setIndex]) });
  renderQuestion();
}
function startExam(){
  state = newState({ kind:"exam", queue: shuffle(WORDS).slice(0, EXAM_N) });
  renderQuestion();
}
function startReview(){
  state = newState({ kind:"review", setIndex: state.setIndex, from: state.kind, queue: shuffle(state.missed) });
  renderQuestion();
}

/* ---------------- quiz ---------------- */
function buildChoices(target){
  const pool = setOfWord(target).filter(x => x.n !== target.n);
  return shuffle([target, ...shuffle(pool).slice(0, 3)]);
}

function headline(){
  if (state.kind === "exam") return "通しテスト";
  if (state.kind === "review") return "復習";
  return `第${KANSUJI[state.setIndex]}集`;
}

function renderQuestion(){
  const q = state.queue[state.i];
  const choices = buildChoices(q);
  state.answered = false;
  const total = state.queue.length;
  const body = mode === "cloze" ? markBlank(q.s) : esc(q.m);

  stage.innerHTML = `
    <div class="fade" style="display:flex;flex-direction:column;gap:16px;">
      <div class="bar">
        <span>${headline()}</span>
        <span class="count">${state.i + 1} / ${total}</span>
      </div>
      <div class="track"><i style="width:${(state.i / total) * 100}%"></i></div>
      <div class="prompt">
        <div class="label">${MODES[mode].prompt}</div>
        <p class="meaning">${body}</p>
      </div>
      <div class="choices">
        ${choices.map((c, k) => `
          <button class="choice" data-n="${c.n}" data-k="${k}">
            <span class="mark">${k + 1}</span>
            <span class="word">${esc(c.w)}</span>
          </button>`).join("")}
      </div>
      <div id="after"></div>
    </div>`;

  stage.querySelectorAll(".choice").forEach(btn => {
    btn.addEventListener("click", () => answer(Number(btn.dataset.n), q));
  });
}

function answer(picked, q){
  if (state.answered) return;
  state.answered = true;
  const ok = picked === q.n;
  if (ok) state.correct++; else state.missed.push(q);

  stage.querySelectorAll(".choice").forEach(btn => {
    const n = Number(btn.dataset.n);
    btn.disabled = true;
    if (n === q.n) btn.classList.add("is-right");
    else if (n === picked) btn.classList.add("is-wrong");
    else btn.classList.add("is-dim");
  });

  const wait = ok ? 1000 : 3000;
  const yomi = q.y ? `（${q.y}）` : "";
  const extra = mode === "cloze"
    ? `<span class="filled">${fillBlank(q.s, q.w)}</span>`
    : "";

  document.getElementById("after").innerHTML = `
    <div class="verdict ${ok ? "ok" : "ng"} fade">
      <span class="head mincho">${ok ? "正解" : "誤答"}<span class="tap">タップで次へ</span></span>
      ${extra}
      <span class="gloss"><b>${esc(q.w)}</b>${yomi}　${esc(q.m)}</span>
      <div class="countdown" style="--dur:${wait}ms"><i></i></div>
    </div>`;

  const bar = stage.querySelector(".countdown");
  if (bar) requestAnimationFrame(() => bar.classList.add("run"));
  state.canSkipAt = Date.now() + 350;
  state.timer = setTimeout(advance, wait);
}

function clearTimer(){
  if (state && state.timer){ clearTimeout(state.timer); state.timer = null; }
}
function advance(){
  clearTimer();
  if (!state || !state.answered) return;
  if (state.i === state.queue.length - 1) renderResult();
  else { state.i++; renderQuestion(); }
}
document.addEventListener("click", () => {
  if (state && state.answered && state.timer && Date.now() >= state.canSkipAt) advance();
});

/* ---------------- result ---------------- */
function renderResult(){
  clearTimer();
  const total = state.queue.length;
  const score = state.correct;
  const isExam = state.kind === "exam";
  const passed = isExam && score >= EXAM_PASS;

  if (state.kind !== "review"){
    const key = isExam ? mode + "-exam" : mode + "-" + state.setIndex;
    const best = loadBest();
    if (best[key] === undefined || score > best[key]){ best[key] = score; saveBest(best); }
  }

  let caption;
  if (isExam) caption = `通しテスト（${MODES[mode].label}）　${EXAM_PASS}問以上で合格`;
  else if (state.kind === "review") caption = "復習の結果";
  else caption = `第${KANSUJI[state.setIndex]}集（${SETS[state.setIndex][0].n}–${SETS[state.setIndex][SETS[state.setIndex].length-1].n}）`;

  const stamp = isExam
    ? `<div class="stamp mincho ${passed ? "y" : "n"}">${passed ? "合格" : "不合格"}</div>`
    : "";

  const missBlock = state.missed.length ? `
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div class="sectitle">取りこぼした語</div>
      <div class="misslist">
        ${state.missed.map(x => `
          <div class="missrow">
            <span class="w mincho">${esc(x.w)}</span>
            <span class="m">${esc(x.m)}</span>
            <span class="y">${x.y || "—"}</span>
          </div>`).join("")}
      </div>
    </div>` : `<p class="sectitle">取りこぼしはございません。</p>`;

  const againLabel = isExam ? "もう一度（別の20問）" : "同じ集をもう一度";

  stage.innerHTML = `
    <div class="fade" style="display:flex;flex-direction:column;gap:18px;">
      <div class="score ${passed ? "pass" : ""}">
        ${stamp}
        <div class="n mincho">${score}<small> / ${total}</small></div>
        <div class="caption">${caption}</div>
      </div>
      ${missBlock}
      <div class="actions">
        ${state.missed.length ? `<button class="btn primary" id="review">間違えた語だけ復習</button>` : ""}
        <button class="btn" id="again">${againLabel}</button>
        <button class="btn" id="home">一覧へ戻る</button>
      </div>
    </div>`;

  const rv = document.getElementById("review");
  if (rv) rv.addEventListener("click", startReview);
  document.getElementById("again").addEventListener("click", () => {
    if (isExam || state.from === "exam") startExam();
    else startSet(state.setIndex);
  });
  document.getElementById("home").addEventListener("click", renderHome);
}

/* ---------------- keyboard ---------------- */
document.addEventListener("keydown", e => {
  if (!state) return;
  if (!state.answered && ["1","2","3","4"].includes(e.key)){
    const btn = stage.querySelector(`.choice[data-k="${Number(e.key) - 1}"]`);
    if (btn) { e.preventDefault(); btn.click(); }
  } else if (state.answered && state.timer && (e.key === "Enter" || e.key === " ")){
    e.preventDefault();
    advance();
  }
});

renderHome();
</script>
