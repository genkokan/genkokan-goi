<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EC">
<meta name="description" content="アプリde現古館｜広島国語屋本舗 現古館の演習アプリ">
</head>
<body>
<title>アプリde現古館</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#F7F4EC; --paper-raised:#FFFDF7; --ink:#22201C; --ink-soft:#6E665A;
    --ink-faint:#A69C8C; --rule:#DED6C6; --shu:#B34026; --shu-soft:#F0E0D8;
    --ai:#2E4A57; --ai-soft:#DFE8EA;
    --shadow:0 1px 0 rgba(34,32,28,.04), 0 6px 18px -12px rgba(34,32,28,.35);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#16161A; --paper-raised:#1E1E23; --ink:#EBE5DA; --ink-soft:#A49C90;
      --ink-faint:#6C6559; --rule:#33323A; --shu:#E27B5E; --shu-soft:#3A2622;
      --ai:#8FB6C4; --ai-soft:#22323A;
      --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -14px rgba(0,0,0,.8);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#16161A; --paper-raised:#1E1E23; --ink:#EBE5DA; --ink-soft:#A49C90;
    --ink-faint:#6C6559; --rule:#33323A; --shu:#E27B5E; --shu-soft:#3A2622;
    --ai:#8FB6C4; --ai-soft:#22323A;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -14px rgba(0,0,0,.8);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--paper); color:var(--ink); margin:0;
    font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    font-size:16px; line-height:1.75; -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:620px; margin:0 auto;
    padding-inline:16px;
    padding-block:calc(22px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; gap:20px;
  }
  .mincho{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;}

  .masthead{border-bottom:1px solid var(--rule); padding-bottom:12px;
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;}
  .masthead h1{font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;
    font-weight:700; font-size:25px; margin:0; letter-spacing:.06em;}
  .masthead .crumb{font-size:12px; color:var(--ink-faint); letter-spacing:.1em; white-space:nowrap;}

  /* ---- 大扉 ---- */
  .gates{display:flex; flex-direction:column; gap:12px;}
  .gate{
    appearance:none; font:inherit; cursor:pointer; text-align:left; width:100%;
    background:var(--paper-raised); color:inherit;
    border:1px solid var(--rule); border-left:3px solid var(--shu); border-radius:2px;
    padding:20px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:4px;
    transition:border-color .15s ease, transform .15s ease;
  }
  .gate:hover{border-color:var(--shu); transform:translateY(-1px);}
  .gate .t{font-family:"Shippori Mincho",serif; font-size:23px; font-weight:700; letter-spacing:.1em;}
  .gate .d{font-size:13px; color:var(--ink-soft);}
  .gate .n{font-size:11.5px; color:var(--ink-faint); letter-spacing:.06em;}

  /* ---- 一覧 ---- */
  .modes{display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--rule); border-radius:2px; overflow:hidden;}
  .modes button{appearance:none; font:inherit; cursor:pointer; background:var(--paper-raised);
    color:var(--ink-soft); border:0; padding:14px 8px; font-size:15px; letter-spacing:.04em;}
  .modes button + button{border-left:1px solid var(--rule);}
  .modes button[aria-selected="true"]{background:var(--shu); color:#FFF8F4; font-weight:700;}
  :root[data-theme="dark"] .modes button[aria-selected="true"]{color:#1A100D;}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .modes button[aria-selected="true"]{color:#1A100D;}
  }

  .setgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  @media (max-width:430px){.setgrid{grid-template-columns:1fr;}}
  .setgrid.tight{grid-template-columns:repeat(2,1fr);}
  .setgrid.tight .setcard{padding:12px 14px;}
  .setgrid.tight .setcard .no{font-size:18px;}
  .setcard{
    appearance:none; text-align:left; cursor:pointer; font:inherit;
    background:var(--paper-raised); color:inherit;
    border:1px solid var(--rule); border-radius:3px; padding:15px 16px;
    display:flex; flex-direction:column; gap:2px; box-shadow:var(--shadow);
    transition:border-color .15s ease, transform .15s ease;
  }
  .setcard:hover{border-color:var(--shu); transform:translateY(-1px);}
  .setcard .no{font-family:"Shippori Mincho",serif; font-size:19px; font-weight:700; letter-spacing:.06em;}
  .setcard .range{font-size:12.5px; color:var(--ink-faint); font-variant-numeric:tabular-nums; letter-spacing:.06em;}
  .setcard .best{font-size:12.5px; color:var(--shu); min-height:1.4em;}

  .examcard{
    appearance:none; text-align:left; cursor:pointer; font:inherit; width:100%;
    background:var(--paper-raised); color:inherit;
    border:1px solid var(--rule); border-left:3px solid var(--shu); border-radius:2px;
    padding:16px; display:flex; justify-content:space-between; align-items:center; gap:14px;
    box-shadow:var(--shadow);
  }
  .examcard:hover{border-color:var(--shu);}
  .examcard .t{font-family:"Shippori Mincho",serif; font-size:19px; font-weight:700; letter-spacing:.08em;}
  .examcard .d{font-size:12.5px; color:var(--ink-faint);}
  .examcard .r{font-size:12.5px; color:var(--shu); text-align:right; flex:0 0 auto;}

  /* ---- 出題 ---- */
  .bar{display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:12.5px; color:var(--ink-soft);}
  .bar .count{font-variant-numeric:tabular-nums; letter-spacing:.08em;}
  .track{height:2px; background:var(--rule); border-radius:2px; overflow:hidden;}
  .track > i{display:block; height:100%; background:var(--shu); transition:width .25s ease;}

  .prompt{
    background:var(--paper-raised); border:1px solid var(--rule); border-left:3px solid var(--shu);
    border-radius:2px; padding:22px 18px; box-shadow:var(--shadow);
  }
  .prompt .label{font-size:12px; letter-spacing:.18em; color:var(--ink-faint); margin-bottom:10px;}
  .prompt .body{
    font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;
    font-size:21px; line-height:1.95; font-weight:500; margin:0; text-wrap:balance;
  }
  .prompt .body .hl{color:var(--shu); font-weight:700; border-bottom:2px solid var(--shu); padding-bottom:1px;}
  .prompt .body .jo{background:var(--shu-soft); border-bottom:2px solid var(--shu); padding:1px 2px;}
  .prompt .sub{font-size:13px; color:var(--ink-soft); margin-top:12px; line-height:1.7;}
  .prompt .sub b{font-family:"Shippori Mincho",serif; font-size:16px; color:var(--ink);}
  .prompt .src{font-size:11.5px; color:var(--faint); letter-spacing:.08em; margin-bottom:4px;}
  .prompt .body.long{font-size:17.5px; line-height:1.95; text-wrap:pretty;}
  .bs{text-decoration:underline; text-decoration-color:var(--shu); text-decoration-thickness:2px;
    text-underline-offset:5px; font-weight:700;}
  .choice .word.sent{font-size:16.5px; line-height:1.7; font-weight:500; letter-spacing:0;}
  .choice.on{border-color:var(--ai); background:var(--ai-soft);}

  .gap.on{color:var(--ai); background:var(--ai-soft); font-weight:700; border-bottom:0;}
  .gap.ansmark{color:var(--shu); background:var(--shu-soft); font-weight:700; border-bottom:0;}
  .gap.ng{color:var(--ai); background:var(--ai-soft); text-decoration:line-through; border-bottom:0;}
  .prompt .qtext{font-size:14px; color:var(--ink-soft); margin:0 0 12px; line-height:1.7;}
  .lb{display:inline-block; font-family:"Zen Kaku Gothic New",sans-serif; font-size:.62em; font-weight:700;
    color:var(--ai); border:1px solid var(--ai); border-radius:2px; padding:0 4px; margin:0 2px;
    line-height:1.4; vertical-align:.25em;}
  .choice .word .bs{text-underline-offset:4px;}
  .choice:disabled .word .bs{text-decoration-color:currentColor;}
  .verdict .why{font-size:13.5px; color:var(--ink); line-height:1.75;}

  /* 句切れ：和歌＋切れ目 */
  .waka{font-family:"Shippori Mincho",serif; font-size:20px; line-height:2.3;
    display:flex; flex-wrap:wrap; align-items:center; margin:0;}
  .waka .ku{padding:0 1px;}
  .gap{
    appearance:none; font:inherit; cursor:pointer; background:transparent; color:var(--ink-faint);
    border:0; border-bottom:1px dotted var(--ink-faint);
    min-width:30px; height:34px; margin:0 2px; padding:0;
    font-size:19px; line-height:1; border-radius:2px;
  }
  .gap:hover{background:var(--shu-soft);}
  .gap:disabled{cursor:default;}

  .choices{display:flex; flex-direction:column; gap:8px;}
  .choice{
    appearance:none; font:inherit; cursor:pointer; text-align:left;
    background:var(--paper-raised); color:inherit;
    border:1px solid var(--rule); border-radius:2px;
    padding:15px 16px; min-height:58px; display:flex; align-items:center; gap:12px;
    transition:border-color .12s ease, background .12s ease;
  }
  .choice:hover:not(:disabled){border-color:var(--ai);}
  .choice:disabled{cursor:default;}
  .choice .mark{flex:0 0 auto; width:26px; height:26px; border-radius:50%;
    border:1px solid var(--rule); display:grid; place-items:center;
    font-size:13px; color:var(--ink-faint); font-variant-numeric:tabular-nums;}
  .choice .word{font-family:"Shippori Mincho",serif; font-size:21px; font-weight:500; letter-spacing:.02em;}
  .choice .word small{font-family:"Zen Kaku Gothic New",sans-serif; font-size:13px; color:var(--ink-soft); margin-left:8px;}
  .choice.is-right{border-color:var(--shu); background:var(--shu-soft);}
  .choice.is-right .mark{border-color:var(--shu); color:var(--shu);}
  .choice.is-wrong{border-color:var(--ai); background:var(--ai-soft); opacity:.85;}
  .choice.is-dim{opacity:.45;}

  /* 縁語：語札 */
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    appearance:none; font:inherit; cursor:pointer;
    font-family:"Shippori Mincho",serif; font-size:19px;
    background:var(--paper-raised); color:inherit;
    border:1px solid var(--rule); border-radius:2px; padding:10px 14px; min-height:48px;
    transition:border-color .12s ease, background .12s ease;
  }
  .chip:hover:not(:disabled){border-color:var(--ai);}
  .chip.on{border-color:var(--ai); background:var(--ai-soft); font-weight:700;}
  .chip.right{border-color:var(--shu); background:var(--shu-soft); color:var(--shu); font-weight:700;}
  .chip.miss{border-color:var(--shu); border-style:dashed; color:var(--shu);}
  .chip.bad{border-color:var(--ai); background:var(--ai-soft); text-decoration:line-through; opacity:.7;}
  .chip:disabled{cursor:default;}

  .verdict{border-top:1px solid var(--rule); padding-top:14px; display:flex; flex-direction:column; gap:6px;}
  .verdict .head{font-family:"Shippori Mincho",serif; font-size:18px; font-weight:700; letter-spacing:.1em;}
  .verdict.ok .head{color:var(--shu);}
  .verdict.ng .head{color:var(--ai);}
  .verdict .head .tap{font-family:"Zen Kaku Gothic New",sans-serif; font-size:11.5px; font-weight:400;
    letter-spacing:.08em; color:var(--ink-faint); margin-left:10px;}
  .verdict .gloss{font-size:14.5px; color:var(--ink-soft);}
  .verdict .gloss b{font-family:"Shippori Mincho",serif; font-weight:700; color:var(--ink); font-size:16px;}
  .verdict .filled{font-family:"Shippori Mincho",serif; font-size:16px; color:var(--ink); line-height:1.9;}
  .verdict .filled em{font-style:normal; font-weight:700; color:var(--shu);}
  .verdict .note{font-size:12.5px; color:var(--ink-faint); line-height:1.7;}
  .countdown{height:2px; background:var(--rule); border-radius:2px; overflow:hidden; margin-top:4px;}
  .countdown > i{display:block; height:100%; width:100%; background:var(--shu); transform-origin:left center;}
  .verdict.ng .countdown > i{background:var(--ai);}
  .countdown.run > i{animation:drain linear forwards; animation-duration:var(--dur,1s);}
  @keyframes drain{from{transform:scaleX(1);} to{transform:scaleX(0);}}

  /* ---- 結果 ---- */
  .score{background:var(--paper-raised); border:1px solid var(--rule); border-radius:2px;
    padding:20px; text-align:center; box-shadow:var(--shadow);}
  .score.pass{border-color:var(--shu); border-width:2px;}
  .score .stamp{font-family:"Shippori Mincho",serif; font-size:22px; font-weight:700; letter-spacing:.3em; margin-bottom:4px;}
  .score .stamp.y{color:var(--shu);} .score .stamp.n{color:var(--ai);}
  .score .n{font-family:"Shippori Mincho",serif; font-size:44px; font-weight:700; line-height:1.2; font-variant-numeric:tabular-nums;}
  .score .n small{font-size:18px; color:var(--ink-faint); font-weight:500;}
  .score .caption{font-size:12.5px; color:var(--ink-soft); letter-spacing:.06em;}
  .sectitle{font-size:11.5px; letter-spacing:.2em; color:var(--ink-faint);}
  .misslist{display:flex; flex-direction:column; border-top:1px solid var(--rule);}
  .missrow{padding:11px 2px; border-bottom:1px solid var(--rule); display:flex; flex-direction:column; gap:2px;}
  .missrow .w{font-family:"Shippori Mincho",serif; font-size:18px; font-weight:700;}
  .missrow .m{font-size:13.5px; color:var(--ink-soft);}

  .actions{display:flex; flex-wrap:wrap; gap:8px;}
  .btn{appearance:none; font:inherit; cursor:pointer; border:1px solid var(--rule);
    background:var(--paper-raised); color:inherit; border-radius:2px;
    padding:12px 18px; font-size:15px; letter-spacing:.04em;
    transition:border-color .12s ease, color .12s ease;}
  .btn:hover{border-color:var(--shu); color:var(--shu);}
  .btn.primary{background:var(--shu); border-color:var(--shu); color:#FFF8F4;}
  :root[data-theme="dark"] .btn.primary{color:#1A100D;}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#1A100D;}}
  .btn.primary:hover{filter:brightness(1.06); color:#FFF8F4;}
  :root[data-theme="dark"] .btn.primary:hover{color:#1A100D;}
  .btn:disabled{opacity:.4; cursor:default;}

  :focus-visible{outline:2px solid var(--ai); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important;}}
  .fade{animation:fade .22s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;}}
  @media (min-width:700px){
    body{font-size:15px;}
    .prompt .body{font-size:20px;}
    .choice .word{font-size:20px;}
  }
</style>

<div class="wrap">
  <header class="masthead">
    <h1 class="mincho">アプリde現古館</h1>
    <span class="crumb" id="crumb"></span>
  </header>
  <main id="stage"></main>
</div>

<script>
/* ==================== 語彙 ==================== */
const WORDS = [
 {n:141,w:"主宰",y:"しゅさい",m:"中心に立って物事を取りしきること",s:"この研究会を［　］しているのは、定年後も現場を離れない老教授である。"},
 {n:142,w:"嚆矢",y:"こうし",m:"物事のはじめ。最初",s:"彼の論文は、この分野における実証研究の［　］とされている。"},
 {n:143,w:"碩学",y:"せきがく",m:"学識が広く深い人。大学者",s:"三十年にわたり古文書を読み続けた［　］の言葉には、やはり重みがある。"},
 {n:144,w:"鑑賞",y:"かんしょう",m:"芸術作品を味わい、楽しむこと",s:"美術館では、急ぎ足で見て回るより一点を長く［　］したほうがよい。"},
 {n:145,w:"享受",y:"きょうじゅ",m:"十分に受け取って味わい楽しむこと",s:"我々が今の便利さを［　］できるのは、先人の苦心のおかげである。"},
 {n:146,w:"原風景",y:"げんふうけい",m:"心の奥にあって原体験を呼び起こす情景",s:"祖父の家の裏にあった雑木林は、私の［　］として今も残っている。"},
 {n:147,w:"漂泊",y:"ひょうはく",m:"あてもなくさまよい流れること",s:"定住を捨て、［　］の旅に生きた歌人の心情を読み取りたい。"},
 {n:148,w:"風雅",y:"ふうが",m:"上品で優美なこと。また、詩歌の道",s:"庭の一隅に苔を置くだけで、そこに［　］な趣が生まれる。"},
 {n:149,w:"美意識",y:"びいしき",m:"美を感じ取る心のはたらき",s:"余白を恐れないところに、この国の［　］があらわれている。"},
 {n:150,w:"賞揚",y:"しょうよう",m:"ほめあげること",s:"戦時下では、自己犠牲がしばしば美徳として［　］された。"},
 {n:151,w:"換言",y:"かんげん",m:"言い換えること",s:"情報が多いほど選べなくなる。［　］すれば、自由は負担にもなる。"},
 {n:152,w:"レトリック",y:"",m:"修辞。言葉を巧みに用いる技法",s:"政治家の演説は、中身よりも［　］の巧みさで記憶される。"},
 {n:153,w:"メタファー",y:"",m:"隠喩。「ようだ」などを使わないたとえ",s:"「人生は旅だ」という表現は、旅を用いた［　］である。"},
 {n:154,w:"ステレオタイプ",y:"",m:"型にはまった見方や表現。紋切り型",s:"「理系の人間は無口だ」という見方は、根拠のない［　］にすぎない。"},
 {n:155,w:"アナロジー",y:"",m:"類似をもとにした推論。類推",s:"生物の進化と言語の変化を重ねる［　］には、やはり限界もある。"},
 {n:156,w:"メタ〜",y:"",m:"「超えた」「一段高い次元の」を表す語",s:"自分の考え方そのものを考えることを、［　］認知と呼ぶ。"},
 {n:157,w:"ジャンル",y:"",m:"分野、種類、部門",s:"落語は話芸という［　］の中でも、とりわけ聞き手を選ばない。"},
 {n:158,w:"ドキュメンタリー",y:"",m:"事実をそのまま記録・構成した作品",s:"演出を排し、漁師の一年をただ追った［　］が高く評価された。"},
 {n:159,w:"アンソロジー",y:"",m:"すぐれた詩文を選んで編んだ作品集",s:"昭和の短編小説を集めた［　］を、入門書として勧めたい。"},
 {n:160,w:"サブカルチャー",y:"",m:"主流の伝統文化に属さない独自の文化",s:"漫画はかつて［　］と見なされたが、今や研究の対象である。"},
 {n:161,w:"ナンセンス",y:"",m:"意味をなさないこと。ばかばかしいこと",s:"議論の前提が誤っている以上、そこから出た結論は［　］である。"},
 {n:162,w:"パロディー",y:"",m:"既存の作品や作風をもじった作品",s:"名画の構図をそのまま広告に用いた［　］が話題を呼んだ。"},
 {n:163,w:"テクスト",y:"",m:"原文、原典。読まれる対象としての文章",s:"作者の意図を離れ、［　］そのものから意味を読み取る立場もある。"},
 {n:164,w:"コンテクスト",y:"",m:"文脈。前後の関係や背景・状況",s:"同じ「けっこうです」も、［　］によって肯定にも否定にもなる。"},
 {n:165,w:"オリジナル",y:"",m:"独創的なもの。原作、原型",s:"模写を重ねた末に、ようやく自分の［　］な作風に至った。"},
 {n:166,w:"パースペクティブ",y:"",m:"遠近法。ものの見方の枠組み",s:"経済だけでなく環境という［　］から、開発の是非を問い直す。"},
 {n:167,w:"モノローグ",y:"",m:"独白。ひとりごと",s:"舞台の中央に立った主人公が、長い［　］を語り始めた。"},

 {no:"18", src:"神奈川大", c:"◎", body:"「さて鷹飼はでは、いかがしたまは【むずる】」といひたれば、やをらたちはしりて、しすゑたる鷹を、にぎりはなちつ。",

 {no:"19", src:"センター試験", c:"◎", body:"・軒端の梅の、かつ咲きそめたるを、女の童折りて、「君ならでは」と見せたりしかば、顔近く引き寄せ、「うれしげにも咲きたる花かな。色よりも香こそあはれなれ。我はかく、今日明日とおぼゆるを、げにこの世のほかの思ひ出これなら【ん】〈a〉かし。桜はまだしくて見ざらんぞ口惜しき。」など、思ひ入れたる顔のにほひ、あらぬ人なれど、さすがになつかしからずはあらず。\n・翁と母、手を捕らへて、呼び生け呼び生け、「なほ言はまほしから【ん】〈b〉ことあらば、のたまへ。心のうち晴るけやらぬは罪深し」など言へば、うちうなづき、「我をば煙となし給ふな。それなん心にかかる。先立ちて二人の親に嘆かせたてまつらん心憂さ、黄泉路もやすくは行きやられじ。また病ひ少し緩みある折々は、辞世の歌、心にかけしを詠みおかず成りぬると、姉君のただならずおはして、近きほどに生ませ給へらん稚児の、めづらかにをかしからん顔つき見ずなりなん、いとど残り多かる。さならでは何の思ひおくことあらん。かまへて亡骸を損なはでをさめて【ん】〈c〉。もしたがひもぞする」とうしろめたげなり。\n・四、五日ありて、初桜の面白きを人のもとよりおこせたるに、とく、ゆかしがりつるものを見せ【ん】〈d〉と、花瓶に挿しおきたれば、うちながめて、「はや咲きにけり。春のゆくへも知らぬ間に」と、言の葉ごとに偲ばるべきふしをとどめ、はかなき筆のすさみにも、あはれなることをのみ書きおけるは、長き世の形見にも見よとなるべし。",
  q:"傍線部a〜dの「ん」の文法的意味の組み合わせとして正しいものを選べ。",
  opts:["a婉曲　b推量　c勧誘　d意志","a推量　b婉曲　c勧誘　d意志","a推量　b意志　c婉曲　d勧誘","a意志　b婉曲　c勧誘　d推量","a婉曲　b推量　c意志　d勧誘"],

]},

 {no:"25", src:"北海道大", conv:true, c:"◎", body:"（光源氏は晩春のある日、北山で可憐な紫の君を垣間見て、ぜひ自宅に引きとりたいと希望していた。だが、祖母尼上は紫の君の幼なさを理由に固辞している。）\n尼上「いとかたじけなきわざにもはべるかな。この君だに、かしこまりも聞こえたまひつべきほどなら【ましかば】」とのたまふ。あはれに聞きたまひて、「何か浅う思ひたまへむことゆゑ、かうすきずきしきさまを見えたてまつらむ。」",

};
let vmode = "meaning";

const stage = document.getElementById("stage");

function loadBest(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); }catch(e){ return {}; } }
function saveBest(o){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(o)); }catch(e){} }
function recordBest(key, score){
  const b = loadBest();
  if (b[key] === undefined || score > b[key]){ b[key] = score; saveBest(b); }
}
function shuffle(a){
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function mark(p, cls){
  return esc(p).replace(/【(.+?)】/, '<span class="'+cls+'">$1</span>');
}
function stripMark(p){ return p.replace(/[【】]/g, ""); }
function setOfWord(w){ return SETS[Math.floor((w.n - WORDS[0].n)/10)]; }

  clearTimer(); state = null; area = "jodo"; crumb.textContent = "助動詞";
  const best = loadBest();
  const cards = JD.map((g,i) => {
    const b = best[`jodo-${i}`];
    return `<button class="setcard" data-jd="${i}">
      <span class="no mincho">${esc(g.g)}</span>
      <span class="range">全${g.items.length}問</span>
      <span class="best">${b === undefined ? "" : `最高 ${b} / ${g.items.length}`}</span>
    </button>`;
  }).join("");
  const eb = best["jodo-exam"];
  stage.innerHTML = `
    <div class="fade" style="display:flex;flex-direction:column;gap:18px;">
      <div class="setgrid tight">${cards}</div>
      <button class="examcard" id="exam">
        <span style="display:flex;flex-direction:column;gap:1px;">
          <span class="t mincho">通しテスト</span>
          <span class="d">全${JD_ALL.length}問から20問を無作為抽出　18問以上で合格</span>
        </span>
        <span class="r">${eb === undefined ? "挑戦" : `最高 ${eb} / ${EXAM_N}`}</span>
      </button>
      <div class="actions"><button class="btn" id="tohome">トップへ戻る</button></div>
    </div>`;
  stage.querySelectorAll("[data-jd]").forEach(b => b.addEventListener("click", () => startJdSec(Number(b.dataset.jd))));
  document.getElementById("exam").addEventListener("click", startJdExam);
  document.getElementById("tohome").addEventListener("click", renderHome);
}

/* ==================== 出題キューの組み立て ==================== */
function jq(gname, it){ return {t:"jd", d:it, sec:gname}; }
function startJdSec(gi){
  const g = JD[gi];
  state = newState({area:"jodo", kind:"set", secId:gi, title:g.g, key:`jodo-${gi}`,
                    queue: shuffle(g.items).map(it => jq(g.g, it))});
  renderQuestion();
}
function startJdExam(){
  state = newState({area:"jodo", kind:"exam", title:"通しテスト", key:"jodo-exam",
                    queue: shuffle(JD_ALL).slice(0,EXAM_N).map(x => jq(x.g, x.d))});
  renderQuestion();
}
function vq(word){ return {t:"vocab", w:word}; }
function wq(sec, item){ return {t:sec.type, d:item, sec:sec.name}; }

function newState(extra){
  clearTimer();
  return Object.assign({i:0, correct:0, missed:[], answered:false, timer:null, canSkipAt:0, stage:1, pick1:null, sel:[]}, extra);
}
function startGoiSet(i){
  state = newState({area:"goi", kind:"set", setIndex:i, title:`第${KANSUJI[i]}集`, key:`goi-${vmode}-${i}`,
                    queue: shuffle(SETS[i]).map(vq)});
  renderQuestion();
}
function startGoiExam(){
  state = newState({area:"goi", kind:"exam", title:"通しテスト", key:`goi-${vmode}-exam`,
                    queue: shuffle(WORDS).slice(0,EXAM_N).map(vq)});
  renderQuestion();
}
function startWakaSec(id){
  const s = WAKA_SECTIONS.find(x => x.id === id);
  state = newState({area:"waka", kind:"set", secId:id, title:s.name, key:`waka-${id}`,
                    queue: shuffle(s.data).map(d => wq(s,d))});
  renderQuestion();
}
function startWakaExam(){
  let all = [];
  WAKA_SECTIONS.forEach(s => s.data.forEach(d => all.push(wq(s,d))));
  state = newState({area:"waka", kind:"exam", title:"通しテスト", key:"waka-exam",
                    queue: shuffle(all).slice(0,EXAM_N)});
  renderQuestion();
}
function startReview(){
  state = newState({area:state.area, kind:"review", secId:state.secId, setIndex:state.setIndex,
                    from:state.kind, title:"復習", queue: shuffle(state.missed)});
  renderQuestion();
}

/* ==================== 出題 ==================== */
function frame(inner){
  const total = state.queue.length;
  return `
    <div class="fade" style="display:flex;flex-direction:column;gap:16px;">
      <div class="bar">
        <span>${esc(state.title)}</span>
        <span class="count">${state.i + 1} / ${total}</span>
      </div>
      <div class="track"><i style="width:${(state.i/total)*100}%"></i></div>
      ${inner}
      <div class="actions" id="submitbar"><button class="btn primary" id="submit" disabled>解答する</button></div>
      <div id="after"></div>
    </div>`;
}
function group(name, items, wordCls){
  return `<div class="choices" data-group="${name}">${items.map((c,k) =>
    `<button class="choice" data-v="${esc(c.v)}" data-k="${k}">
       <span class="mark">${k+1}</span>
       <span class="word${wordCls ? " " + wordCls : ""}">${c.h}</span>
     </button>`).join("")}</div>`;
}

/* 選択：確定するまで何度でも選び直せる */
function bindGroups(need, multi){
  state.sel = {}; state.need = need; multi = multi || [];
  stage.querySelectorAll("[data-group]").forEach(gEl => {
    const name = gEl.dataset.group;
    gEl.querySelectorAll(".choice, .gap, .chip").forEach(b => b.addEventListener("click", ev => {
      ev.stopPropagation();
      if (state.answered) return;
      if (multi.includes(name)){
        b.classList.toggle("on");
        const vs = [...gEl.querySelectorAll(".on")].map(x => x.dataset.v);
        if (vs.length) state.sel[name] = vs; else delete state.sel[name];
      } else {
        gEl.querySelectorAll(".on").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
        state.sel[name] = b.dataset.v;
      }
      gEl.querySelectorAll(".gap").forEach(x => { x.textContent = x.classList.contains("on") ? "／" : "・"; });
      document.getElementById("submit").disabled = !state.need.every(n => state.sel[n] !== undefined);
    }));
  });
}
function onSubmit(fn){
  document.getElementById("submit").addEventListener("click", ev => {
    ev.stopPropagation();
    if (state.answered || document.getElementById("submit").disabled) return;
    document.getElementById("submitbar").remove();
    fn(state.sel);
  });
}
function paintGroup(name, right, picked){
  const R = [].concat(right).map(String), P = [].concat(picked === undefined ? [] : picked).map(String);
  stage.querySelectorAll(`[data-group="${name}"] .choice, [data-group="${name}"] .chip`).forEach(b => {
    const v = b.dataset.v, chip = b.classList.contains("chip");
    b.disabled = true; b.classList.remove("on");
    if (R.includes(v)) b.classList.add(chip ? (P.includes(v) ? "right" : "miss") : "is-right");
    else if (P.includes(v)) b.classList.add(chip ? "bad" : "is-wrong");
    else if (!chip) b.classList.add("is-dim");
  });
}

function renderQuestion(){
  clearTimer();
  state.answered = false; state.sel = {}; state.need = [];
  const q = state.queue[state.i];
  ({vocab:rVocab, kugire:rKugire, kake:rKake, lead:rLead, jo:rJo, engo:rEngo, tech:rTech, jd:rJd})[q.t](q);
  window.scrollTo(0, 0);
}

/* --- 語彙 --- */
function rVocab(q){
  const w = q.w;
  const pool = setOfWord(w).filter(x => x.n !== w.n);
  const opts = shuffle([w, ...shuffle(pool).slice(0,3)]).map(x => ({v:String(x.n), h:esc(x.w)}));
  const body = vmode === "cloze"
    ? esc(w.s).replace("［　］", '<span class="hl">［　　］</span>')
    : esc(w.m);
  stage.innerHTML = frame(`
    <div class="prompt">
      <div class="label">${VMODES[vmode].prompt}</div>
      <p class="body">${body}</p>
    </div>
    ${group("main", opts)}`);
  bindGroups(["main"]);
  onSubmit(sel => {
    paintGroup("main", w.n, sel.main);
    const extra = vmode === "cloze"
      ? `<span class="filled">${esc(w.s).replace("［　］", "<em>"+esc(w.w)+"</em>")}</span>` : "";
    finish(Number(sel.main) === w.n, `${extra}<span class="gloss"><b>${esc(w.w)}</b>${w.y ? "（"+w.y+"）" : ""}　${esc(w.m)}</span>`);
  });
}

/* --- 句切れ：切れ目と根拠を選んでから解答 --- */
function rKugire(q){
  const d = q.d;
  let waka = '<p class="waka" data-group="gap">';
  d.k.forEach((ku,i) => {
    waka += `<span class="ku">${esc(ku)}</span>`;
    if (i < 4) waka += `<button class="gap" data-v="${i}" aria-label="${i+1}句と${i+2}句の間">・</button>`;
  });
  waka += "</p>";
  const why = KUGIRE_WHY.map(x => ({v:x.m, h:`${x.m}　<small>${x.t}</small>`}));
  stage.innerHTML = frame(`
    <div class="prompt">
      <div class="label">句切れの位置をタップ</div>
      ${waka}
    </div>
    <div class="sectitle">そう判断した根拠は</div>
    ${group("why", why)}`);
  bindGroups(["gap","why"]);
  onSubmit(sel => {
    stage.querySelectorAll(".gap").forEach(x => {
      x.disabled = true; x.classList.remove("on");
      const g = Number(x.dataset.v);
      if (g === d.at){ x.classList.add("ansmark"); x.textContent = "／"; }
      else if (String(g) === sel.gap){ x.classList.add("ng"); x.textContent = "／"; }
      else x.textContent = "・";
    });
    paintGroup("why", d.m, sel.why);
    finish(Number(sel.gap) === d.at && sel.why === d.m,
      `<span class="gloss"><b>${KUGIRE_NAME[d.at]}</b>　${d.m}　${esc(d.w)}</span>`);
  });
}

/* --- 掛詞 --- */
function rKake(q){
  const d = q.d;
  const picked = []; const seen = new Set([d.a + d.b]);
  shuffle(KAKE).forEach(x => {
    if (picked.length < 3 && !seen.has(x.a + x.b)){ seen.add(x.a + x.b); picked.push(x); }
  });
  const opts = shuffle([d, ...picked]).map(x => ({v:x.a + "／" + x.b, h:`${esc(x.a)} と ${esc(x.b)}`}));
  stage.innerHTML = frame(`
    <div class="prompt">
      <div class="label">傍線部の掛詞に掛けられた二つの意味は</div>
      <p class="body">${mark(d.p,"hl")}</p>
    </div>
    ${group("main", opts)}`);
  bindGroups(["main"]);
  onSubmit(sel => {
    const right = d.a + "／" + d.b;
    paintGroup("main", right, sel.main);
    finish(sel.main === right, `<span class="gloss"><b>${esc(d.k)}</b>　……　${esc(d.a)} と ${esc(d.b)}</span>`);
  });
}

/* --- 枕詞 --- */
function rLead(q){
  const d = q.d;
  const opts = shuffle([d.ans, ...d.d]).map(x => ({v:x, h:esc(x)}));
  stage.innerHTML = frame(`
    <div class="prompt">
      <div class="label">傍線部の枕詞が導いている語は</div>
      <p class="body">${mark(d.p,"hl")}</p>
    </div>
    ${group("main", opts)}`);
  bindGroups(["main"]);
  onSubmit(sel => {
    paintGroup("main", d.ans, sel.main);
    finish(sel.main === d.ans,
      `<span class="gloss">導いている語　<b>${esc(d.ans)}</b></span>` +
      (d.note ? `<span class="note">※${esc(d.note)}</span>` : ""));
  });
}

/* --- 序詞：導く語と基準を選んでから解答 --- */
function rJo(q){
  const d = q.d;
  const words = shuffle([d.ans, ...d.d]).map(x => ({v:x, h:esc(x)}));
  const why = JO_WHY.map(x => ({v:x.m, h:`${x.m}　<small>${x.t}</small>`}));
  stage.innerHTML = frame(`
    <div class="prompt">
      <div class="label">網掛けの序詞が導いている語と、序詞と判断する基準を選ぶ</div>
      <p class="body">${mark(d.p,"jo")}</p>
    </div>
    <div class="sectitle">導いている語</div>
    ${group("word", words)}
    <div class="sectitle">判断する基準</div>
    ${group("why", why)}`);
  bindGroups(["word","why"]);
  onSubmit(sel => {
    paintGroup("word", d.ans, sel.word);
    paintGroup("why", d.m, sel.why);
    finish(sel.word === d.ans && sel.why === d.m,
      `<span class="gloss">導いている語　<b>${esc(d.ans)}</b>　／　${d.m}　${esc(d.w)}</span>` +
      (d.note ? `<span class="note">※${esc(d.note)}</span>` : ""));
  });
}

/* --- 縁語：複数選択 --- */
function rEngo(q){
  const d = q.d;
  const chips = shuffle([...d.e, ...d.x]);
  stage.innerHTML = frame(`
    <div class="prompt">
      <div class="label">中心語の縁語をすべて選ぶ</div>
      <p class="body">${esc(d.p)}</p>
      <p class="sub">中心語　<b>${esc(d.c)}</b></p>
    </div>
    <div class="chips" data-group="chips">${chips.map(c => `<button class="chip" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div>`);
  bindGroups(["chips"], ["chips"]);
  onSubmit(sel => {
    const picked = sel.chips || [];
    paintGroup("chips", d.e, picked);
    const ok = picked.length === d.e.length && d.e.every(x => picked.includes(x));
    finish(ok, `<span class="gloss"><b>${esc(d.c)}</b>　……　${d.e.map(esc).join("・")}</span>`);
  });
}

/* --- 修辞技法の判別 --- */
function rTech(q){
  const d = q.d;
  const opts = shuffle([d.ans, ...d.d]).map(x => ({v:x, h:esc(x)}));
  stage.innerHTML = frame(`
    <div class="prompt">
      <div class="label">この和歌に用いられている修辞技法は</div>
      <p class="body">${esc(stripMark(d.p))}</p>
    </div>
    ${group("main", opts)}`);
  bindGroups(["main"]);
  onSubmit(sel => {
    paintGroup("main", d.ans, sel.main);
    finish(sel.main === d.ans, `<span class="gloss"><b>${esc(d.ans)}</b>　${esc(d.w)}</span>`);
  });
}

/* --- 助動詞：本文は全文、選択肢は原典の順のまま --- */
function jdMark(t){
  return esc(t)
    .replace(/【(.*?)】/g, '<span class="bs">$1</span>')
    .replace(/〈(.*?)〉/g, '<span class="lb">$1</span>')
    .replace(/\n/g, "<br>");
}
function jdAnswer(d){ return Array.isArray(d.a) ? d.a : [d.a]; }
function jdFeedback(d){
  const ans = jdAnswer(d);
  const txt = ans.map(i => d.opts[i-1].replace(/[【】]/g, "")).join("／");
  return `<span class="gloss">正答　<b>${ans.join("・")}</b>　${esc(txt)}</span>
          <span class="why">${jdMark(d.why)}</span>`;
}
function rJd(q){
  const d = q.d;
  const opts = d.opts.map((o,i) => ({v:String(i+1), h:jdMark(o)}));
  stage.innerHTML = frame(`
    <div class="prompt">
      <div class="src">問${esc(d.no)}　${esc(d.src)}</div>
      <p class="qtext">${esc(d.q)}</p>
      <p class="body long">${jdMark(d.body)}</p>
    </div>
    ${d.multi ? `<div class="sectitle">あてはまるものをすべて選ぶ</div>` : ""}
    ${group("main", opts, "sent")}`);
  bindGroups(["main"], d.multi ? ["main"] : []);
  onSubmit(sel => {
    const ans = jdAnswer(d);
    const picked = [].concat(sel.main).map(Number);
    paintGroup("main", ans, picked);
    const ok = picked.length === ans.length && ans.every(x => picked.includes(x));
    finish(ok, jdFeedback(d));
  });
}

/* ==================== 採点と送り ==================== */
/* 正解：1秒で自動送り（タップで即送り）　誤答：「次の問題へ」を押すまで止める */
function finish(ok, html){
  if (state.answered) return;
  state.answered = true;
  if (ok) state.correct++; else state.missed.push(state.queue[state.i]);
  const last = state.i === state.queue.length - 1;
  document.getElementById("after").insertAdjacentHTML("beforeend", `
    <div class="verdict ${ok ? "ok" : "ng"} fade">
      <span class="head mincho">${ok ? "正解" : "誤答"}${ok ? '<span class="tap">タップで次へ</span>' : ""}</span>
      ${html}
      ${ok
        ? `<div class="countdown" style="--dur:1000ms"><i></i></div>`
        : `<div class="actions" style="margin-top:10px;"><button class="btn primary" id="next">${last ? "結果を見る" : "次の問題へ"}</button></div>`}
    </div>`);
  const v = stage.querySelector(".verdict");
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (v && v.scrollIntoView) v.scrollIntoView({block:"nearest", behavior: reduce ? "auto" : "smooth"});
  if (ok){
    const bar = stage.querySelector(".countdown");
    if (bar) requestAnimationFrame(() => bar.classList.add("run"));
    state.canSkipAt = Date.now() + 350;
    state.timer = setTimeout(advance, 1000);
  } else {
    document.getElementById("next").addEventListener("click", ev => { ev.stopPropagation(); advance(); });
  }
}
function clearTimer(){ if (state && state.timer){ clearTimeout(state.timer); state.timer = null; } }
function advance(){
  clearTimer();
  if (!state || !state.answered) return;
  if (state.i === state.queue.length - 1) renderResult();
  else { state.i++; renderQuestion(); }
}
/* 正解時のみ、画面タップで待ち時間を飛ばす */
document.addEventListener("click", () => {
  if (state && state.answered && state.timer && Date.now() >= state.canSkipAt) advance();
});

/* ==================== 結果 ==================== */
function missLabel(q){
  if (q.t === "vocab") return {w:q.w.w, m:q.w.m};
  const d = q.d;
  if (q.t === "kugire") return {w:KUGIRE_NAME[d.at] + "　" + d.m, m:d.k.join("　")};
  if (q.t === "kake")   return {w:d.k + "　……　" + d.a + " と " + d.b, m:stripMark(d.p)};
  if (q.t === "lead")   return {w:d.ans, m:stripMark(d.p)};
  if (q.t === "jo")     return {w:d.ans + "　／　" + d.m, m:stripMark(d.p)};
  if (q.t === "engo")   return {w:d.c + "　……　" + d.e.join("・"), m:d.p};
  if (q.t === "jd"){
    const ans = jdAnswer(d);
    return {w:`${q.sec}　${d.src}　正答 ${ans.join("・")}`, m:stripMark(d.body)};
  }
  return {w:d.ans, m:stripMark(d.p)};
}
function renderResult(){
  clearTimer();
  const total = state.queue.length, score = state.correct;
  const isExam = state.kind === "exam";
  const passed = isExam && score >= EXAM_PASS;
  if (state.kind !== "review") recordBest(state.key, score);

  const miss = state.missed.length ? `
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div class="sectitle">取りこぼし</div>
      <div class="misslist">${state.missed.map(q => {
        const L = missLabel(q);
        return `<div class="missrow"><span class="w mincho">${esc(L.w)}</span><span class="m">${esc(L.m)}</span></div>`;
      }).join("")}</div>
    </div>` : `<p class="sectitle">取りこぼしはございません。</p>`;

  stage.innerHTML = `
    <div class="fade" style="display:flex;flex-direction:column;gap:18px;">
      <div class="score ${passed ? "pass" : ""}">
        ${isExam ? `<div class="stamp mincho ${passed?"y":"n"}">${passed?"合格":"不合格"}</div>` : ""}
        <div class="n mincho">${score}<small> / ${total}</small></div>
        <div class="caption">${esc(state.title)}${isExam ? `　${EXAM_PASS}問以上で合格` : ""}</div>
      </div>
      ${miss}
      <div class="actions">
        ${state.missed.length ? `<button class="btn primary" id="review">間違えた分だけ復習</button>` : ""}
        <button class="btn" id="again">${isExam ? "もう一度（別の20問）" : "もう一度"}</button>
        <button class="btn" id="list">一覧へ戻る</button>
      </div>
    </div>`;

  const rv = document.getElementById("review");
  if (rv) rv.addEventListener("click", startReview);
  document.getElementById("again").addEventListener("click", () => {
    const wasExam = isExam || state.from === "exam";
    if (state.area === "goi") wasExam ? startGoiExam() : startGoiSet(state.setIndex);
    else if (state.area === "waka") wasExam ? startWakaExam() : startWakaSec(state.secId);
    else wasExam ? startJdExam() : startJdSec(state.secId);
  });
  document.getElementById("list").addEventListener("click", () =>
    ({goi:renderGoiHome, waka:renderWakaHome, jodo:renderJodoHome})[state.area]());
}

/* ==================== キーボード ==================== */
/* 数字キーで選択、Enterで「解答する」／「次の問題へ」 */
document.addEventListener("keydown", e => {
  if (!state) return;
  if (!state.answered && /^[1-9]$/.test(e.key)){
    const b = stage.querySelectorAll(".choice:not(:disabled), .chip:not(:disabled)")[Number(e.key) - 1];
    if (b){ e.preventDefault(); b.click(); }
  } else if (e.key === "Enter"){
    const s = document.getElementById("submit"), n = document.getElementById("next");
    if (!state.answered && s && !s.disabled){ e.preventDefault(); s.click(); }
    else if (n){ e.preventDefault(); n.click(); }
    else if (state.answered && state.timer){ e.preventDefault(); advance(); }
  }
});

renderHome();
</script>
